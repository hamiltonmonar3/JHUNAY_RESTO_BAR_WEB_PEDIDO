<!-- Agregamos la clase dinámica aquí en el <main> -->
<main class="login-screen" [class.light-mode]="theme.mode() !== 'dark'">
  <button class="theme-toggle login-theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.mode() === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro'" [title]="theme.mode() === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro'">{{ theme.mode() === 'dark' ? '☼' : '☾' }}</button>
  
  <section class="login-content">
    <section class="login-panel" aria-label="Acceso de personal">
      <div class="login-brand-lockup">
        <img src="/assets/images/logo.jpeg" alt="Jhunay Resto Bar" />
        <div class="login-brand-copy">
          <p>PORTAL DEL EQUIPO</p>
          <strong>JHUNAY RESTO BAR</strong>
        </div>
      </div>
      <p class="login-tagline">Pedidos, servicio y caja en un solo lugar.</p>

      @if (setupMessage) {
        <div class="login-message" role="status">{{ setupMessage }}</div>
      }
      @if (errorMessage()) {
        <div class="login-error" role="alert">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="login-field">
          <label for="username">USUARIO</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" placeholder="Ej. c.cabrera" [(ngModel)]="username" required />
          </div>
        </div>

        <div class="login-field">
          <label for="pin">PIN DE ACCESO</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" minlength="6" maxlength="12" autocomplete="current-password" placeholder="••••••" [(ngModel)]="pin" required />
          </div>
          <p class="pin-hint">
            <span class="hint-icon">ⓘ</span> PIN numérico de 6 a 12 dígitos.
          </p>
        </div>

        <button class="login-button" type="submit" [disabled]="pending() || !username || pin.length < 6">
          {{ pending() ? 'Validando…' : 'Ingresar →' }}
        </button>
      </form>
    </section>
  </section>
</main>
