<!-- Agregamos la clase dinámica aquí en el <main> -->
<main class="login-screen" [class.light-mode]="theme.mode() !== 'dark'">
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.mode() === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro'">
    {{ theme.mode() === 'dark' ? '☀️' : '🌙' }}
  </button>
  
  <section class="login-content">
    <div class="login-card">
      <header class="login-header">
        <div class="logo-container">
          <img src="/assets/images/logo.jpeg" alt="Logo" class="logo-img" />
        </div>
        <div class="brand-text">
          <h1 class="title">JHUNAY <span>RESTO BAR</span></h1>
        </div>
      </header>

      @if (setupMessage) {
        <div class="alert message" role="status">{{ setupMessage }}</div>
      }
      @if (errorMessage()) {
        <div class="alert error" role="alert">
          <span class="alert-icon">⚠️</span>
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-container">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input id="username" name="username" type="text" [(ngModel)]="username" required placeholder="tu.usuario" autocomplete="username" autocapitalize="none" />
          </div>
        </div>

        <div class="form-group">
          <label for="pin">Clave de Acceso</label>
          <div class="input-container">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input [type]="showPin() ? 'text' : 'password'" id="pin" name="pin" [(ngModel)]="pin" required 
                   placeholder="••••••" minlength="6" maxlength="12" pattern="[A-Za-z0-9]+" autocomplete="current-password" />
            <button type="button" class="view-toggle" (click)="togglePin()" [title]="showPin() ? 'Ocultar' : 'Mostrar'">
              {{ showPin() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <button class="btn-submit" type="submit" [disabled]="pending() || !loginForm.valid">
          @if (pending()) {
            <span class="loader"></span> Validando...
          } @else {
            Ingresar al Sistema <span class="arrow">→</span>
          }
        </button>
      </form>
      
      <footer class="login-footer">
        <p>Pedidos, servicio y caja en un solo lugar.</p>
      </footer>
    </div>
  </section>
</main>
